[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "mylekiwi"
version = "0.1.0"
description = "Single-frame GroundingDINO, SAM2, Depth Anything V2 and AnyGrasp pipeline for LeKiwi/SO-101"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "draccus>=0.11.6,<0.12",
  "lerobot==0.6.2",
  "numpy>=2.0,<2.3",
  "opencv-python-headless>=4.9,<4.14",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
planner = [
  "lerobot[kinematics]",
  "transformers>=5.4,<5.6",
]
jetson = [
  "lerobot[feetech]",
]

[tool.uv.sources]
lerobot = { path = "third_party/lerobot", editable = true }

[tool.setuptools.packages.find]
include = ["mylekiwi*"]
