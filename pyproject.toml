[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "mylekiwi"
version = "0.1.0"
description = "Single-frame GroundingDINO, SAM2, Depth Anything V2 and AnyGrasp pipeline for LeKiwi/SO-101"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "draccus>=0.11.6,<0.12",
  "lerobot[feetech,placo-dep]>=0.6.2,<0.7",
  "numpy>=2.0,<2.3",
  "opencv-python-headless>=4.9,<4.14",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "torch>=2.7,<2.12",
  "transformers>=5.4,<5.6",
]

[tool.setuptools.packages.find]
include = ["mylekiwi*"]
